name: Assemble release assets

on:
  push:
    branches: [main]
    paths:
      - ".asset-parts/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble exact binary assets
        shell: bash
        run: |
          cat .asset-parts/nodus/* > nodus-siphonophore-v2.png
          mkdir -p assets
          cat .asset-parts/contact/* > assets/contact-sheet.png

          echo "4fadb055a1e96d06b3b4468eb5eeed704a6c37400592975fce3ee00d5761baa9  nodus-siphonophore-v2.png" | sha256sum -c -
          echo "c38a00f951d6d64f84bca673e647af0cc2485e780ddaa9bbd4c1518a38d221d5  assets/contact-sheet.png" | sha256sum -c -

      - name: Replace transport parts with the finished files
        shell: bash
        run: |
          rm -rf .asset-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble exact pet atlas and contact sheet"
          git push
